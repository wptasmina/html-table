<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive HTML table With Pure CSS - Web Dev Simplified</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="table">
        <section class="table__header">
            <h1>Customer's Orders</h1>
        </section>

        <section class="table__body">
            <table>
               <thead>
                 <tr>
                    <th>Id</th>
                    <th>Customer</th>
                    <th>Location</th>
                    <th>Order Date</th>
                    <th>Status</th>
                    <th>Amount</th>
                </tr>
               </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td><img src="images/img1.jfif" alt="men picture">Zinzu Chan Lee</td>
                    <td>Seoul</td>
                    <td>17 Nov 2026</td>
                    <td>Delivered</td>
                    <td>$150.00</td>
                </tr>
                <!-- <tr>
                    <td>2</td>
                    <td><img src="images/img2.jfif" alt="men picture">John Doe</td>
                    <td>New York</td>
                    <td>21 Dec 2026</td>
                    <td>Pending</td>
                    <td>$1,200.00</td>
                </tr> -->
            </tbody>
            </table>
        </section>

    </main>
</body>
</html>
